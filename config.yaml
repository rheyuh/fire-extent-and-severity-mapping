stac:                                   # verified in 1.1 (docs/data-sources.md)
  endpoint: https://explorer.dea.ga.gov.au/stac
  collections: [ga_s2am_ard_3, ga_s2bm_ard_3, ga_s2cm_ard_3]
  cloud_cover_property: eo:cloud_cover

bands:                                  # verified in 1.1
  nir: nbart_nir_2                      # B8A, 864.7 nm
  swir2: nbart_swir_3                   # B12, 2202.4 nm (not nbart_swir_2, which is B11)
  fmask: oa_fmask
  nodata: -999
  fmask_keep: [1]                       # 1 = clear; 0 null, 2 cloud, 3 shadow, 4 snow, 5 water are dropped

grid:
  resolution: 20                        # metres; native for B8A and B12
  crs: EPSG:3308                        # verified in 1.2: FESM's CRS, GDA94 / NSW Lambert

dates:                                  # checked in 1.4: clear scenes found for every chosen fire
  pre_fire_days: 60                     # search window before the fire starts
  post_fire_days: 60                    # search window after the fire ends

severity:                               # PLACEHOLDER: decided in 2.3 after reading FESM (1.2)
  thresholds: [0.10, 0.27, 0.44, 0.66]  # Key & Benson dNBR breaks, illustrative only
  classes: {}                           # severity class name -> FESM class code, from 1.2

qa: {}                                  # PLACEHOLDER: gate limits decided in 3.1

outputs:
  root: outputs

# Chosen in 1.4 (docs/data-sources.md). Dates and FireNo from the NPWS snapshot of 2026-11-09.
# A fire may override the default windows with its own pre_fire_days / post_fire_days.
