[project]
name = "fesmqa"
version = "0.1.0"
description = "Validates NSW FESM burn severity maps against independent Sentinel-2 dNBR, with QA gates and provenance."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "rheyuh", email = "r.iai@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
# The same uv everywhere (laptop, CI, Docker): uv refuses to run outside this range.
required-version = ">=0.13.7,<0.14"
# A plain project with a script (run.py), not an installable package.
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP modern syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# rasterio ships no type hints (no py.typed), so mypy treats its objects as Any.
module = ["rasterio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# run.py is a script in the project root, not an installed package: let tests import it.
pythonpath = ["."]
