[project]
name = "fesmqa"
version = "0.1.0"
description = "Validates NSW FESM burn severity maps against independent Sentinel-2 dNBR, with QA gates and provenance."
readme = "README.md"
authors = [
    { name = "rheyuh", email = "r.iai@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.1",
]

[project.scripts]
fesmqa = "fesmqa.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
