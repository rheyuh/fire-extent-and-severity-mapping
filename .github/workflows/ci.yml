name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so the secret scan sees every commit, not just the latest

      # Pinned gitleaks image. --user matches the runner's file owner so git accepts the repo;
      # --redact keeps any found secret out of the CI log.
      - name: Secrets
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

      # setup-uv publishes no floating major tag (no @v10), so pin the exact release.
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Types
        run: uv run mypy src tests

      - name: Tests
        run: uv run pytest
